<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class task</title>
     <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <!-- container for all cards -->
    <section class="container">
        <!-- build card container here -->
        <div class="card">
            <div class="left-info" style="--background-color: green">
                <div class="center-horizontally">
                    <p id="user-level">Level 13</p>
                </div>
                <div>
                    <img src="https://cdn-icons-png.flaticon.com/512/147/147144.png" alt="male avatar with beard">
                </div>
                <div class="center-horizontally">
                    <p id="user-points">5,434 points</p>
                </div>
            </div>
            <div class="right-info">
                <header>
                    <h1>Leena Patil</h1>
                </header>
                <div>
                    <p id="user-description">
                        Lorem ipsum dolor sit amet, consectetur adipiscing elit. Fusce a volutpat mauris, at molestie lacus. Nam vestibulum sodales odio ut pulvinar.
                    </p>
                </div>
                <div class="linkedin-link">
                    <a href="#">
                        <i class="fa fa-linkedin-square"></i>
                    </a>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
